name: Preview Release

on:
  push:
    tags:
      - "preview-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Preview version, for example 0.1.0"
        required: true
        type: string
      publish_npm:
        description: "Publish @castle-xx/axm-preview to npm"
        default: true
        required: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            version="${version#preview-v}"
            version="${version#v}"
            tag="preview-v${version}"
            publish_npm="${{ inputs.publish_npm }}"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#preview-v}"
            publish_npm="true"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish_npm=$publish_npm" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: preview/go.mod
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm --dir preview/site install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir preview/site exec playwright install --with-deps chromium

      - name: Verify preview
        run: make -C preview verify

      - name: Package release artifacts
        run: make -C preview release VERSION=${{ steps.release.outputs.version }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Axiom Preview $VERSION" \
              --notes-file preview/dist/release/RELEASE_NOTES.md
            gh release upload "$TAG" preview/dist/release/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" preview/dist/release/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Axiom Preview $VERSION" \
              --notes-file preview/dist/release/RELEASE_NOTES.md
          fi

      - name: Detect npm token
        id: npm_token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package
        if: ${{ steps.release.outputs.publish_npm == 'true' && steps.npm_token.outputs.available == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: preview/dist/npm
        run: npm publish --access public

      - name: Skip npm publish
        if: ${{ steps.release.outputs.publish_npm == 'true' && steps.npm_token.outputs.available != 'true' }}
        run: echo "NPM_TOKEN secret is not configured; npm publish was skipped."
