name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Root scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test root scripts
        run: node --test tests/*.mjs

  preview:
    name: Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/axm-preview/go.mod
          cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/axm-preview/site/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir apps/axm-preview/site install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir apps/axm-preview/site exec playwright install --with-deps chromium

      - name: Verify preview
        run: make -C apps/axm-preview verify

      - name: Package preview release
        run: make -C apps/axm-preview release VERSION=0.0.0-ci.0

      - name: Dry-run npm package
        working-directory: apps/axm-preview/dist/npm
        run: npm pack --dry-run
